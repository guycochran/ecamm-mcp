name: Bug report
description: Something in ecamm-mcp doesn't work the way the README says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Community project, best effort. Not affiliated with Ecamm. **No live-show support.**
        Every field below is required. Reports without them will be closed, because we can't reproduce anything without them.
        Please remove stream keys, guest links and anything private before pasting.
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: |
        Terminal install: run `~/.ecamm-mcp/ecamm-mcp doctor` and paste everything it prints.
        Extension install: ask Claude "What's my Ecamm status?" and paste the full reply, including the server block.
      render: text
    validations:
      required: true
  - type: input
    id: ecamm
    attributes:
      label: Ecamm Live version
      description: Ecamm Live menu > About Ecamm Live
      placeholder: "4.6.2"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac type
      description: Apple menu > About This Mac
      placeholder: "macOS 15.1, Apple silicon"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client and version
      description: The app you use ecamm-mcp from, and whether you installed the extension or used Terminal
      placeholder: "Claude desktop 1.2.3, extension"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ecamm-mcp version
      placeholder: "0.3.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you typed, in order, what you expected, and what happened instead. Say whether Ecamm was idle, live or recording.
      placeholder: |
        1. Ecamm idle, Record Only mode
        2. Typed "..."
        3. Expected ...
        4. Got ...
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I am not in the middle of a live show. I understand there is no live-show support.
          required: true
        - label: I read "What Ecamm's API can't do" in the README, and this isn't one of those.
          required: true
