name: Bug report
description: Something in ecamm-mcp doesn't work the way the README says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Community project, best effort. Not affiliated with Ecamm. There is no live-show support: replies can take days.
        The details below are what make a report reproducible. Fill in what you can.
        Please remove stream keys, guest links and anything private before pasting.
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output, or the exact error
      description: |
        Terminal install: run `~/.ecamm-mcp/ecamm-mcp doctor` and paste what it prints.
        Extension install: ask Claude "What's my Ecamm status?" and paste the full reply, including the server block.
        If you can't get either (for example the install itself failed), paste the exact error message and say at which step it appeared.
      render: text
    validations:
      required: true
  - type: input
    id: ecamm
    attributes:
      label: Ecamm Live version
      description: Ecamm Live menu > About Ecamm Live
      placeholder: "4.6.2"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac type
      description: Apple menu > About This Mac
      placeholder: "macOS 15.8.2, Intel"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client and version
      description: The app you use ecamm-mcp from, and whether you installed the extension or used Terminal
      placeholder: "Claude desktop 5.1231.2, extension"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ecamm-mcp version
      description: Leave blank if the install failed before you could tell
      placeholder: "0.3.0"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you typed, in order, what you expected, and what happened instead. Say whether Ecamm was idle, live or recording at the time.
      placeholder: |
        1. Ecamm idle, Record Only mode
        2. Typed "..."
        3. Expected ...
        4. Got ...
    validations:
      required: true
