name: Feature request
description: Suggest something ecamm-mcp could do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Community project, best effort. Not affiliated with Ecamm.
        ecamm-mcp can only do what Ecamm's Remote Control API offers. Today that API cannot read live chat, send events, create or edit scenes, report for certain that you are live, or return the recording file's path. You can still ask for those: such requests get the `upstream-ecamm` label and stay on record, but nothing in this project can deliver them.
  - type: textarea
    id: want
    attributes:
      label: What do you want to do?
      description: Describe the show situation, not the solution. What were you trying to get done?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps today
      description: How you do it now, by hand or with a Stream Deck, and where ecamm-mcp falls short.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output, or the exact error
      description: |
        Terminal install: run `~/.ecamm-mcp/ecamm-mcp doctor` and paste what it prints.
        Extension install: ask Claude "What's my Ecamm status?" and paste the full reply, including the server block.
        If you can't get either (for example the install itself failed), paste the exact error message and say at which step it appeared.
      render: text
    validations:
      required: true
  - type: input
    id: ecamm
    attributes:
      label: Ecamm Live version
      placeholder: "4.6.2"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac type
      placeholder: "macOS 15.8.2, Intel"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client and version
      placeholder: "Claude desktop 5.1231.2, extension"
    validations:
      required: true
